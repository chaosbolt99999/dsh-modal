name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The classifier is the safety core and the engine tests are network-free,
      # so the whole suite runs here without Modal credentials.
      - name: Test
        run: pnpm test

      - name: Typecheck host
        run: npx tsc -b

      - name: Typecheck client
        run: npx tsc -p tsconfig.client.json

      - name: Build
        run: pnpm build
